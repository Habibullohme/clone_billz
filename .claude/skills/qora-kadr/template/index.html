<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Qora Kadr — reels</title>
    <script src="lib/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter QK"; font-weight: 600; font-style: normal; src: url("fonts/inter-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Inter QK"; font-weight: 600; font-style: normal; src: url("fonts/inter-latin-ext-600-normal.woff2") format("woff2"); unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: "Inter QK"; font-weight: 400; font-style: italic; src: url("fonts/inter-latin-400-italic.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Inter QK"; font-weight: 400; font-style: italic; src: url("fonts/inter-latin-ext-400-italic.woff2") format("woff2"); unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }

      body { margin: 0; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }

      /* Kvadrat kartochka: 9:16 kanvas markazida, 950×950, burchak 72px */
      #card {
        position: absolute; left: 65px; top: 485px; width: 950px; height: 950px;
        border-radius: 72px; overflow: hidden;
      }
      #card .media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.82) contrast(1.05) saturate(0.95); }
      /* Matn orqasida yumshoq soya — ochiq kadrlarda ham o'qiladi */
      #card::after { content: ""; position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 60% 34% at 50% 50%, rgba(0,0,0,0.28), rgba(0,0,0,0) 100%); }

      /* Ikki qatorli sarlavha: blok markazda, qatorlar chapga tekislangan */
      .cap {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-family: "Inter QK", sans-serif; color: #fff; letter-spacing: -0.01em;
        text-shadow: 0 0 14px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.6);
      }
      .cap .box { display: flex; flex-direction: column; align-items: flex-start; }
      .cap .l1 { display: block; font-weight: 600; font-size: 46px; line-height: 1.08; }
      .cap .l2 { display: block; font-weight: 400; font-style: italic; font-size: 44px; line-height: 1.08; opacity: 0.88; }
      .cap .w { display: block; }

      #fade { position: absolute; inset: 0; background: #000; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="9">
      <!-- 1-qatlam: kadrlar (keskin kesish, o'tish effekti yo'q). Video bo'lsa: <video class="media clip" muted playsinline ...> -->
      <div id="card">
        <img id="m1" class="media clip" src="assets/sahna-1.jpg" data-start="0" data-duration="2.6" data-track-index="0" />
        <img id="m2" class="media clip" src="assets/sahna-2.jpg" data-start="2.6" data-duration="2.4" data-track-index="0" />
        <img id="m3" class="media clip" src="assets/sahna-3.jpg" data-start="5" data-duration="2" data-track-index="0" />
      </div>

      <!-- 2-qatlam: sarlavhalar. l1 = qalin, l2 = kursiv. Har so'z ovozga mos chiqadi (data-in). -->
      <div id="c1" class="cap clip" data-start="0" data-duration="2.6" data-track-index="1">
        <div class="box"><span class="l1 w" data-in="0.25">Savdo</span><span class="l2 w" data-in="1.0">tezroq.</span></div>
      </div>
      <div id="c2" class="cap clip" data-start="2.6" data-duration="2.4" data-track-index="1">
        <div class="box"><span class="l1 w" data-in="0.1">Hisobot</span><span class="l2 w" data-in="0.8">aniqroq.</span></div>
      </div>
      <div id="c3" class="cap clip" data-start="5" data-duration="2" data-track-index="1">
        <div class="box"><span class="l1 w" data-in="0.1">Boshlang</span><span class="l2 w" data-in="0.7">bugun.</span></div>
      </div>
      <!-- Final: kartochka yo'qoladi, faqat oxirgi so'z qora fonda qoladi -->
      <div id="c4" class="cap clip" data-start="7" data-duration="2" data-track-index="1">
        <div class="box"><span class="l1 w" data-in="hold" style="visibility: hidden">Boshlang</span><span class="l2 w" data-in="hold">bugun.</span></div>
      </div>

      <!-- Ovoz va musiqa (ixtiyoriy):
      <audio id="ovoz" src="assets/ovoz.mp3" data-start="0" data-duration="7" data-track-index="2"></audio>
      <audio id="musiqa" src="assets/musiqa.mp3" data-start="0" data-duration="9" data-track-index="3" data-volume="0.35"></audio> -->

      <div id="fade"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Boshida qoradan 0.4s ochilish
      tl.fromTo("#fade", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power1.out" }, 0);
      // Har so'z: tez, yumshoq paydo bo'lish (harakatsiz)
      document.querySelectorAll(".cap").forEach((cap) => {
        const start = parseFloat(cap.dataset.start);
        cap.querySelectorAll(".w").forEach((w) => {
          if (w.dataset.in === "hold") return; // oldingi sahnadan davom etadi, qayta chiqmaydi
          const at = start + parseFloat(w.dataset.in || 0);
          tl.fromTo(w, { opacity: 0 }, { opacity: w.classList.contains("l2") ? 0.88 : 1, duration: 0.18, ease: "none" }, at);
        });
      });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
